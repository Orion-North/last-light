<!doctype html><meta charset="utf-8"><title>Active input experience checks</title>
<style>body{background:#171918;color:#eee;font:14px system-ui}button{padding:10px}output{display:block;white-space:pre-wrap}iframe{width:100%;height:700px;border:0}</style>
<button id="run">Run input checks</button><button id="audio-preview">Preview fresh audio</button><p id="audio-state">Audio context: not created</p><output>Ready. Isolated preferences; simulated connected controller. Audio policy requires a real gesture in the game.</output><iframe title="Production input experience"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('output');
const pad={id:'DualSense Wireless Controller',index:0,mapping:'standard',connected:true,axes:[0,0,0,0],buttons:Array.from({length:17},()=>({value:0,pressed:false}))};
let memory=new Map(),errors=[];
window.installInputExperience=win=>{
 const NativeAudio=win.AudioContext || win.webkitAudioContext;
 if(NativeAudio)win.AudioContext=class extends NativeAudio {constructor(...args){super(...args);const report=()=>document.querySelector('#audio-state').textContent='Audio context: '+this.state;this.addEventListener('statechange',report);report();}};
 Object.defineProperty(win.document,'hidden',{configurable:true,get:()=>false});
 Object.defineProperty(win,'localStorage',{value:{getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k)}});
 Object.defineProperty(win.navigator,'getGamepads',{value:()=>[pad]});
 win.addEventListener('error',e=>errors.push(e.message));
 win.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument;
const assert=(ok,label)=>{if(!ok)throw Error(label);};
async function until(test,label){const end=Date.now()+6000;while(!test()){if(Date.now()>end)throw Error('Timeout: '+label);await sleep(30);}}
function key(key){doc().body.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key,bubbles:true}));doc().body.dispatchEvent(new frame.contentWindow.KeyboardEvent('keyup',{key,bubbles:true}));}
async function load(){const html=await(await fetch('../../index.html')).text();const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.srcdoc=html.replace('<head>','<head><base href="../../"><script>parent.installInputExperience(window);<\/script>');await loaded;await until(()=>doc()?.querySelector('[data-action="begin"]'),'title');}
document.querySelector('#audio-preview').onclick=async()=>{memory=new Map([['last-light-settings',JSON.stringify({touch:false,haptics:false,reducedMotion:true})]]);document.querySelector('#audio-state').textContent='Audio context: not created';await load();out.textContent='Use Begin or Enter inside the game to verify native audio activation.';};
document.querySelector('#run').onclick=async()=>{
 const results=[];out.textContent='Running…';errors=[];memory=new Map([['last-light-settings',JSON.stringify({touch:false,haptics:false,reducedMotion:true})]]);
 try{
 await load();await sleep(200);
 assert(!doc().body.classList.contains('controller-active'),'Idle connected pad stole input');
 assert(doc().querySelector('[data-action="begin"] .input-keycap')?.textContent==='Enter','Begin keyboard keycap missing');results.push('PASS idle connected controller leaves keyboard prompts');
 assert(doc().querySelector('#sound-toggle').getAttribute('aria-pressed')==='true','First-run sound should default on');results.push('PASS first-run sound enabled');
 pad.buttons[12]={value:1,pressed:true};await until(()=>doc().body.dataset.input==='controller','controller activity');pad.buttons[12]={value:0,pressed:false};await sleep(80);
 assert(doc().querySelector('[data-action="begin"] .controller-glyph'),'Controller glyph missing');
 key('Tab');await until(()=>doc().body.dataset.input==='keyboard','keyboard takeover');await sleep(200);assert(doc().body.dataset.input==='keyboard','Idle pad reclaimed keyboard');results.push('PASS meaningful controller then keyboard takeover');
 pad.buttons[12]={value:1,pressed:true};await until(()=>doc().body.dataset.input==='controller','controller reclaim');pad.buttons[12]={value:0,pressed:false};
 const about=doc().querySelector('[data-action="about"]');about.dispatchEvent(new frame.contentWindow.PointerEvent('pointerdown',{bubbles:true,pointerType:'mouse',pointerId:1}));assert(doc().querySelector('[data-action="about"]')===about,'Pointer target replaced');about.click();await until(()=>doc().querySelector('#credits-modal')?.open,'first mouse click');assert(doc().body.dataset.input==='pointer','Pointer takeover missing');results.push('PASS first mouse click preserves target and opens About');
 doc().querySelector('#credits-modal').close();doc().querySelector('#sound-toggle').click();assert(JSON.parse(memory.get('last-light-settings')).sound===false,'Mute preference missing');await load();assert(doc().querySelector('#sound-toggle').getAttribute('aria-pressed')==='false','Reload forgot explicit mute');results.push('PASS explicit mute persists across reload');
 key('Enter');await until(()=>doc().body.dataset.screen==='intro','Enter from canvas begins');key('Enter');await sleep(100);assert(doc().body.dataset.screen==='intro','Enter skipped intro');results.push('PASS Enter starts from canvas and preserves intro');
 assert(!errors.length,errors.join('\n'));
 }catch(error){results.push('FAIL '+error.message);}out.textContent=results.join('\n')+'\nDONE';
};
</script>

<!doctype html><meta charset="utf-8"><title>Discovery camera integration review</title>
<style>body{margin:0;background:#171918;color:#eee;font:14px system-ui}nav{padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{padding:7px}output{white-space:pre-wrap;display:block;padding:8px;height:40px;overflow:auto}iframe{display:block;border:0;width:100%;height:calc(100vh - 96px);margin:auto}</style>
<nav><select id="scene"><option value="first-morning">First morning</option><option value="stone-ripples">Last Chance</option><option value="blueberries">Berry Bowl</option><option value="ordinary-day">Perseverance Valley</option><option value="last-image">Last image</option></select><select id="phase"><option>transmit</option><option>observe</option><option>choose</option><option>received</option><option value="investigation">finish investigation</option></select><label><input type="checkbox" id="pad">Simulated controller</label><label><input type="checkbox" id="motion">Reduced motion</label><button id="load">Load scene</button><button id="desktop">Desktop</button><button id="portrait">Portrait</button><button id="short">Short</button><button id="verify">Verify lifecycle</button></nav><output>Loading</output><div id="physical" style="padding:4px 8px">Physical mast: waiting for rendered camera</div><iframe title="Discovery camera game"></iframe>
<script type="module">
import {scenes} from '../../src/content/story.js';
const frame=document.querySelector('iframe'),output=document.querySelector('output');
let memory=new Map(),seed,padEnabled=false,samples=[],errors=[],captures=0,physicalError=Infinity,physicalAt=0;
window.recordDiscoveryPose=error=>{physicalError=error;if(performance.now()-physicalAt>150){physicalAt=performance.now();document.querySelector("#physical").textContent=`Physical mast error: ${error.toFixed(4)} m`;}};
const pad={id:'DualSense',index:0,mapping:'standard',connected:true,axes:[0,0,0,0],buttons:Array.from({length:17},()=>({value:0,pressed:false})),vibrationActuator:{effects:['dual-rumble'],playEffect:async()=>{},reset:async()=>{}}};
window.installDiscovery=win=>{
 const backing=memory;
 // Keep this isolated harness running while other QA tabs are inspected.
 Object.defineProperty(win.document,'hidden',{get:()=>false});
 win.addEventListener('blur',event=>event.stopImmediatePropagation());
 Object.defineProperty(win.navigator,'getGamepads',{value:()=>padEnabled?[pad]:[]});
 Object.defineProperty(win,'localStorage',{value:{getItem:k=>backing.get(k)??null,setItem:(k,v)=>backing.set(k,String(v)),removeItem:k=>backing.delete(k)}});
 win.addEventListener('error',e=>errors.push(e.message));
 win.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
 win.document.addEventListener('discovery-camera-sample',e=>samples.push(e.detail));
 win.document.addEventListener('world-status',e=>{if(e.detail.state==='ready')output.textContent='Ready: '+document.querySelector('#scene').value;});
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(test,ms=10000){const start=Date.now();while(!test()){if(Date.now()-start>ms)throw Error('Timed out');await sleep(60);}}
async function load(preserve=false){
 const id=document.querySelector('#scene').value,index=scenes.findIndex(s=>s.id===id),selectedPhase=document.querySelector('#phase').value,phase=selectedPhase==='investigation'?'observe':selectedPhase;
 samples=[];errors=[];padEnabled=document.querySelector('#pad').checked;pad.axes.fill(0);pad.buttons.forEach(b=>{b.value=0;b.pressed=false;});
 if(!preserve){const choices=scenes.slice(0,index+(['transmit','received'].includes(phase)?1:0)).map(s=>s.choices[0].id);
 memory=new Map([['last-light-settings',JSON.stringify({touch:false,haptics:false,prompts:'auto',reducedMotion:document.querySelector('#motion').checked})],['last-light-journey-v1',JSON.stringify({version:1,sceneIndex:index,phase,choices,checkpoint:{sceneId:id,reached:true,position:{x:id==='blueberries'?-5:7,z:id==='blueberries'?-10:-7,heading:0},...(selectedPhase==='investigation'?{tool:{sceneId:id,stage:'compare',cursor:{x:0,y:0},sampleIds:id==='blueberries'?['bedrock','grains']:['lower','upper'],visited:[Array(40).fill(true),Array(40).fill(true)],cleared:Array(576).fill(1)}}:{})}})]]);}
 const html=await(await fetch('../../index.html')).text();const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.srcdoc=html.replace('<head>','<head><base href="../../"><script>parent.installDiscovery(window);<\/script>').replace('<script type="module" src="./src/main.js"><\/script>', `<script type="module">
 import * as THREE from 'three';
 THREE.Mesh.prototype.onBeforeRender=function(renderer,scene,camera){
  if(!document.querySelector('.discovery-camera') || !camera.isPerspectiveCamera)return;
  const rover=scene.children.find(child=>child.isGroup && child.children.some(o=>o.isPointLight));
  if(!rover)return;
  rover.updateMatrixWorld(true);
  const expected=rover.localToWorld(new THREE.Vector3(-.046,1.585,.487)).addScaledVector(camera.getWorldDirection(new THREE.Vector3()),.34);
  parent.recordDiscoveryPose(camera.position.distanceTo(expected));
 };
 await import('./src/main.js');
 <\/script>`);
 await loaded;
 await waitFor(()=>frame.contentDocument?.querySelector('[data-action="begin"]'));
 frame.contentWindow.focus();frame.contentDocument.querySelector('[data-action="begin"]').click();
}
document.querySelector('#load').onclick=()=>load();
for(const [id,w,h] of [['desktop','100%','calc(100vh - 96px)'],['portrait','390px','760px'],['short','960px','480px']])document.getElementById(id).onclick=()=>{frame.style.width=w;frame.style.height=h;};
document.querySelector('#verify').onclick=async()=>{
 const checks=[];output.textContent='Checking actual rendered camera…';
 const check=(ok,message)=>{checks.push((ok?'PASS ':'FAIL ')+message);output.textContent=checks.join('\n');};
 try{
  await load();let d=frame.contentDocument,w=frame.contentWindow;
  if(document.querySelector('#phase').value==='investigation') {
   await waitFor(()=>d.querySelector('[data-action="compare-samples"]'));
   d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
   d.querySelector('[data-action="compare-samples"]').click();
   await waitFor(()=>d.querySelector('[data-action="capture-discovery"]:not(:disabled)'));
   const neutral=samples.at(-1).yaw;
   for(let i=0;i<5;i++){
    d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',repeat:true,bubbles:true}));await sleep(80);
   }
   check(Math.abs(samples.at(-1).yaw-neutral)<.005,'held tool arrow cannot steer the new mast');
   const beforeFresh=samples.at(-1).yaw;
   d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));await sleep(250);
   d.body.dispatchEvent(new w.KeyboardEvent('keyup',{key:'ArrowLeft',bubbles:true}));
   check(Math.abs(samples.at(-1).yaw-beforeFresh)>.02,'a different fresh arrow works without releasing the carried key');
   d.body.dispatchEvent(new w.KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));
  }
  await waitFor(()=>d.querySelector('[data-action="capture-discovery"]:not(:disabled)'));
  check(samples.some(s=>s.ready),'camera becomes ready');
  check(physicalError<.03,'production rendered eye matches real grounded mast: '+physicalError.toFixed(4)+'m');
  check(!d.querySelector('[data-action="assist-observation"],[data-action="skip-intro"]'),'no inline skips');
  const before=samples.at(-1).yaw;d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await sleep(450);d.body.dispatchEvent(new w.KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));await sleep(150);
  check(Math.abs(samples.at(-1).yaw-before)>.03,'keyboard changes framing');
  // Cancel between the DOM shutter update and the scheduled GPU readback.
  d.querySelector('[data-action="capture-discovery"]').click();
  d.querySelector('.brand').click();await sleep(400);
  check(d.body.dataset.screen==='title' && !d.querySelector('.discovery-camera,.photo-uplink'),'canceled painted capture cannot reopen the game');
  // Continue from the same production save; camera input must start fresh.
  if(padEnabled){pad.buttons[5]={value:1,pressed:true};await sleep(100);}
  d.querySelector('[data-action="begin"]').click();
  await waitFor(()=>d.querySelector('[data-action="capture-discovery"]:not(:disabled)'));
  if(padEnabled){
   await sleep(180);check(!!d.querySelector('.discovery-camera[data-stage="aim"]'),'preheld bumper requires release after entering the camera');
   pad.buttons[5]={value:0,pressed:false};await sleep(150);
   pad.buttons[0]={value:1,pressed:true};await sleep(150);pad.buttons[0]={value:0,pressed:false};await sleep(150);
   check(!!d.querySelector('.discovery-camera[data-stage="aim"]'),'primary button does not trigger the camera shutter');
   pad.buttons[5]={value:1,pressed:true};await waitFor(()=>!d.querySelector('.discovery-camera[data-stage="aim"]'));pad.buttons[5]={value:0,pressed:false};
   check(!!d.querySelector('.discovery-camera[data-stage="capturing"],.discovery-camera[data-stage="revealing"]'),'right bumper triggers the shutter');
  }else d.querySelector('[data-action="capture-discovery"]').click();
  d.querySelector('#settings-toggle').click();await sleep(500);
  const held=d.querySelector('.discovery-camera');
  check(!!held && ['capturing','revealing'].includes(held.dataset.stage),'pause during shutter keeps the captured/live camera present');
  check(!d.querySelector('.photo-uplink'),'pause at shutter cannot consume the image beats');
  d.querySelector('#settings-modal [data-close]').click();
  const captureAt=performance.now();
  await waitFor(()=>d.querySelector('.discovery-camera[data-stage="revealing"]') || d.querySelector('.photo-uplink'));
  check(performance.now()-captureAt<2000,'capture becomes reveal in '+Math.round(performance.now()-captureAt)+' ms');
  // Capture and authentic-image proof belong to the reveal, before the original uplink takes over.
  await waitFor(()=>d.querySelector('.discovery-camera[data-stage="revealing"] [data-discovery-photo]')?.naturalWidth>0);
  check(true,'authentic NASA photograph appears during reveal');
  if(!document.querySelector('#motion').checked){
   check(d.querySelector('.discovery-camera__capture')?.src.startsWith('blob:'),'actual WebGL frame captured during reveal');
   check(!d.querySelector('[data-action="transmit"]'),'no send action during reveal');
   const source=d.querySelector('.discovery-camera__capture')?.src;
   d.querySelector('#settings-toggle').click();await sleep(1600);
   check(!!d.querySelector('.discovery-camera[data-stage="revealing"]'),'pause holds reveal lifecycle');
   check(d.querySelector('.discovery-camera__capture')?.src===source,'pause preserves captured image');
   d.querySelector('#settings-modal [data-close]').click();
   await waitFor(()=>d.querySelector('.photo-uplink[data-stage="handoff"]'));
   d.querySelector('.photo-uplink [data-action="transmit"]')?.click();await sleep(60);
   check(!d.querySelector('.upload-terminal[data-stage="sending"]') && JSON.parse(memory.get('last-light-journey-v1')).phase==='transmit','send cannot commit during handoff');
   d.querySelector('#settings-toggle').click();await sleep(900);
   check(!!d.querySelector('.photo-uplink[data-stage="handoff"]'),'pause holds handoff lifecycle');
   d.querySelector('#settings-modal [data-close]').click();
  }
  await waitFor(()=>d.querySelector('.photo-uplink[data-stage="uplink"]'));
  check(!!d.querySelector('.upload-terminal[data-stage="ready"] .signal-map'),'original signal map restored before send');
  check(!d.querySelector('[data-action="retake-discovery"]'),'uplink has no Retake action');
  check(!d.querySelector('.photo-uplink__photo,[data-discovery-photo]'),'uplink has no persistent photo panel');
  if(padEnabled){pad.buttons[0]={value:1,pressed:true};await sleep(130);pad.buttons[0]={value:0,pressed:false};}else d.querySelector('[data-action="transmit"]').click();
  await waitFor(()=>d.querySelector('.upload-terminal[data-stage="received"] [data-action="next"]'));
  check(!!d.querySelector('.upload-terminal[data-stage="received"] .signal-map'),'original Mars–Earth receipt remains visible');
  const map=d.querySelector('.signal-map');check(map.textContent.includes('MARS') && map.textContent.includes('EARTH'),'receipt map names Mars and Earth');
  check(!d.querySelector('[data-action="retake-discovery"],.photo-uplink__photo,[data-discovery-photo]'),'receipt has no Retake action or persistent photo panel');
  check(errors.length===0,'no runtime errors '+errors.join('; '));
  const saved=JSON.parse(memory.get('last-light-journey-v1'));check(saved.phase==='received','receipt saved');
  output.textContent=checks.join('\n');
 }catch(error){check(false,error.message);}
};
await load();
</script>

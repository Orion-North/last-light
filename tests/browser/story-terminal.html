<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production terminal voice review</title>
<link rel="stylesheet" href="../../src/ui/story-console.css">
<style>:root{--mono:ui-monospace,monospace}body{margin:32px;background:#10171d;color:#eee;font:14px system-ui}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}button,label{margin:8px;padding:8px}#console{max-width:700px;margin:60px auto}output{display:block;white-space:pre-wrap}</style>
<button id="play">Type thought</button><button id="pause">Pause</button><label><input type="checkbox" id="reduced">Reduced motion</label><label><input type="checkbox" id="mute">Mute</label><output>Native Type thought starts production audio. This review uses the production writer and sound, with no saved progress.</output><div id="console"></div>
<script type="module">
import {renderStoryConsole,createStoryWriter} from '../../src/ui/story-console.js';
import {createSound} from '../../src/audio/sound.js';
let paused=false,key=0,pulses=0,started=false;
const $=s=>document.querySelector(s),sound=createSound(),line={speaker:'rover',text:'I found something. A little piece of Mars, worth sending home.'};
const writer=createStoryWriter({paused:()=>paused,reducedMotion:()=>$('#reduced').checked,pulse:cue=>{pulses++;sound.textPulse(cue);}});
$('#play').onclick=async()=>{started=await sound.start();pulses=0;$('#console').innerHTML=renderStoryConsole({line,time:'2004 · EARLY MISSION'});writer.mount($('#console'),line,String(++key));};
$('#pause').onclick=()=>{paused=!paused;document.body.dataset.paused=String(paused);$('#pause').textContent=paused?'Resume':'Pause';if(paused)sound.pause();else sound.resume();};
$('#mute').onchange=()=>sound.setMuted($('#mute').checked);
setInterval(()=>{const typed=$('.story-console__typed')?.textContent||'';$('output').textContent=`Audio started: ${started}\nVisible characters: ${typed.length} / ${line.text.length}\nPulse callbacks: ${pulses}\nPaused: ${paused}`;},60);
addEventListener('pagehide',()=>{writer.stop();sound.destroy();});
</script>
